name: Daily data + deploy

on:
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      RIKSBANK_API_KEY: ${{ secrets.RIKSBANK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen

      # A failing source keeps the committed parquet
      - name: FRED
        continue-on-error: true
        run: uv run python -c "from assets.fred import save_fred_parquet; save_fred_parquet()"
      - name: AMECO
        continue-on-error: true
        run: uv run python -c "from assets.ameco import save_ameco_parquet; save_ameco_parquet()"
      - name: Daily yields
        continue-on-error: true
        run: uv run python -c "from assets.daily_yields import save_daily_parquet; save_daily_parquet()"

      - run: uv run python scripts/build_data.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add src/data/*.parquet
          git diff --cached --quiet || (git commit -m "data: daily update [skip ci]" && git push)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
