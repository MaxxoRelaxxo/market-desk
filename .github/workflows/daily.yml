name: Daily data + deploy

on:
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      RIKSBANK_API_KEY: ${{ secrets.RIKSBANK_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      # Last successful data; a failing source falls back to it
      - uses: actions/cache@v4
        with:
          path: src/data
          key: data-${{ github.run_id }}
          restore-keys: data-
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen

      - name: FRED
        continue-on-error: true
        run: uv run python -c "from assets.fred import save_fred_parquet; save_fred_parquet()"
      - name: AMECO
        continue-on-error: true
        run: uv run python -c "from assets.ameco import save_ameco_parquet; save_ameco_parquet()"
      - name: Daily yields
        continue-on-error: true
        run: uv run python -c "from assets.daily_yields import save_daily_parquet; save_daily_parquet()"
      - name: Swedish rates (SWEA)
        continue-on-error: true
        run: uv run python -c "from assets.swedish_data import save_svea_parquet; save_svea_parquet()"
      - name: Yahoo Finance (commodities, indices)
        continue-on-error: true
        run: uv run python -c "from assets.yfinance import save_yfinance_parquet; save_yfinance_parquet()"
      - name: CFTC Commitments of Traders
        continue-on-error: true
        run: uv run python -c "from assets.cftc import save_cot_parquet; save_cot_parquet()"
      - name: SEC EDGAR fundamentals
        continue-on-error: true
        run: uv run python -c "from assets.sec import save_sec_parquet; save_sec_parquet()"

      - run: uv run python scripts/build_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
